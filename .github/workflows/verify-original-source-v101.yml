name: Verify original-source 1.0.1 build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Dispatch fresh workflow ID
        run: gh workflow run original-source-v101-build.yml --repo "$REPO" --ref main

      - name: Find dispatched smoke run
        id: run
        run: |
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list --repo "$REPO" --workflow original-source-v101-build.yml --branch main --event workflow_dispatch --limit 1 --json databaseId,status --jq '.[0].databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "Smoke run: $RUN_ID"
              exit 0
            fi
            sleep 2
          done
          echo "Could not find smoke run" >&2
          exit 1

      - name: Wait for smoke run
        run: gh run watch '${{ steps.run.outputs.run_id }}' --repo "$REPO" --exit-status
