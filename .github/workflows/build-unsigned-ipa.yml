name: Build Hitomi Swift 1.0 IPA

on:
  push:
    branches: [main, v1.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore v1.0 source
        run: python3 bootstrap_source.py

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: brew install xcodegen autoconf automake libtool pkg-config

      - name: Validate source files
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/validate_project.sh

      - name: Build full unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./Scripts/build_unsigned_ipa.sh

      - name: Verify full runtime payload
        run: |
          IPA=build-unsigned/HitomiSwiftFull-unsigned.ipa
          unzip -t "$IPA"
          unzip -l "$IPA" | head -160
          unzip -l "$IPA" | grep 'original_pyc.zip'
          unzip -l "$IPA" | grep 'Python.framework/Python'
          unzip -l "$IPA" | grep 'LibtorrentNative.framework/LibtorrentNative'
          unzip -l "$IPA" | grep 'openssl.framework/openssl'
          shasum -a 256 "$IPA"

      - name: Upload v1.0 IPA
        uses: actions/upload-artifact@v4
        with:
          name: HitomiSwiftFull-v1.0-unsigned-ipa
          path: build-unsigned/HitomiSwiftFull-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HitomiSwiftFull-v1.0-build-diagnostics
          path: |
            build-unsigned
            HitomiSwiftFull.xcodeproj
            .runtime-cache
            Runtime
          if-no-files-found: ignore
          retention-days: 7
