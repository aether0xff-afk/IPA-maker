name: Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore bundled source
        run: python3 bootstrap_source.py

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate source files
        run: ./Scripts/validate_project.sh

      - name: Build unsigned IPA
        run: ./Scripts/build_unsigned_ipa.sh

      - name: Inspect IPA
        run: |
          unzip -l build-unsigned/HitomiSwiftFull-unsigned.ipa | head -80
          shasum -a 256 build-unsigned/HitomiSwiftFull-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HitomiSwiftFull-unsigned-ipa
          path: build-unsigned/HitomiSwiftFull-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HitomiSwiftFull-build-diagnostics
          path: |
            build-unsigned
            HitomiSwiftFull.xcodeproj
          if-no-files-found: ignore
          retention-days: 7
